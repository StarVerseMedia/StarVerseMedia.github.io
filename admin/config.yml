backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/YOUR-REPOSITORY-NAME
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - label: "Home"
        name: "home"
        file: "index.html"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Content", name: "body", widget: "markdown" }

      - label: "About"
        name: "about"
        file: "about.html"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Content", name: "body", widget: "markdown" }

  - name: "actors"
    label: "Actors"
    folder: "actors"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Actor Name", name: "title", widget: "string" }
      - { label: "Photo", name: "image", widget: "image", required: false }
      - { label: "Content", name: "body", widget: "markdown", required: false }

  - name: "news"
    label: "News"
    folder: "news"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Content", name: "body", widget: "markdown" }

  - name: "photos"
    label: "Photos"
    folder: "photos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Photo", name: "image", widget: "image" }
      - { label: "Description", name: "body", widget: "markdown", required: false }

  - name: "reels"
    label: "Reels"
    folder: "reels"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Reel URL", name: "url", widget: "string" }
      - { label: "Thumbnail", name: "image", widget: "image", required: false }
      - { label: "Description", name: "body", widget: "markdown", required: false }
